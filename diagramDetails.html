<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    const params = new URLSearchParams(window.location.search);
    const value = params.get("target"); // returns "bar"
    document.addEventListener("DOMContentLoaded", function() {
        const titleElement = document.getElementById("documentTitle");
        if (titleElement) {
            titleElement.textContent = value;
        }
        const imageElement = document.getElementById("diagramImage");
        if (imageElement) {
            imageElement.src = value;
            imageElement.alt = value;
        }
    });
    </script>
    <title id = "documentTitle">Document</title>
</head>
<body>
    <a href="javascript:history.back()">Back</a><br><br>
    <img id="diagramImage" src="" alt="Image not loaded" style="width:100%;height:auto;">
</body>
</html>
